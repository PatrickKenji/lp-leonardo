<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" fill="none">
  <rect width="1400" height="1400" fill="#F4F8FF"/>

  <defs>
    <linearGradient id="blueStrong" x1="0" y1="0" x2="1400" y2="1400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A61C3"/>
      <stop offset="0.55" stop-color="#137DFF"/>
      <stop offset="1" stop-color="#0655B1"/>
    </linearGradient>

    <linearGradient id="blueSoft" x1="0" y1="0" x2="1400" y2="1400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8DBFF"/>
      <stop offset="0.5" stop-color="#7AADFF"/>
      <stop offset="1" stop-color="#DDEAFF"/>
    </linearGradient>

    <linearGradient id="blueLine" x1="0" y1="0" x2="1400" y2="1400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7D0FF"/>
      <stop offset="0.5" stop-color="#137DFF"/>
      <stop offset="1" stop-color="#B7D0FF"/>
    </linearGradient>

    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>

    <style>
      .line {
        stroke: url(#blueLine);
        stroke-width: 4;
        stroke-linecap: round;
        fill: none;
      }

      .bar {
        stroke: url(#blueStrong);
        stroke-width: 24;
        stroke-linecap: round;
        fill: none;
      }

      .bar-soft {
        stroke: url(#blueSoft);
        stroke-width: 42;
        stroke-linecap: round;
        fill: none;
      }

      .diamond {
        stroke: url(#blueStrong);
        stroke-width: 12;
        stroke-linejoin: round;
      }

      .diamond-soft {
        stroke: url(#blueSoft);
        stroke-width: 10;
        stroke-linejoin: round;
      }

      .fill-blue { fill: url(#blueStrong); }
      .fill-soft { fill: url(#blueSoft); }
    </style>
  </defs>

